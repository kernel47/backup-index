[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "backup-index"
version = "0.2.0"
description = "Administration prudente des index OpenSearch de la plateforme Backup"
requires-python = ">=3.12"
dependencies = ["opensearch-py>=2.6,<4", "typer>=0.12,<1", "pydantic-settings>=2.2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
backup-index = "backup_index.cli:app"

[tool.setuptools]
packages = ["backup_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: opt-in real scripts against isolated loopback OpenSearch"]
